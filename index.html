<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Discord Embed Studio</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1b4b);
            --panel-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #e2e8f0;
            --discord-chat: #313338;
            --discord-content: #2b2d31;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            padding: 30px 15px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .wrapper {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .top-bar {
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .version-badge {
            background: #e0e7ff;
            color: #4338ca;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .templates-group, .actions-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .btn-preset {
            background: #f1f5f9;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-preset:hover {
            background: #e2e8f0;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }
        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }
        .card {
            background: var(--panel-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }
        h2 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--text-main);
            border-bottom: 2px solid var(--border);
            padding-bottom: 8px;
        }
        .draggable-section {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 15px;
            background: #fafafa;
            cursor: grab;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .draggable-section:active {
            cursor: grabbing;
        }
        .draggable-section.dragging {
            opacity: 0.4;
            border: 2px dashed var(--accent);
        }
        .section-header {
            font-weight: 700;
            color: var(--accent);
            font-size: 0.85rem;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            user-select: none;
        }
        label {
            display: block;
            margin-top: 8px;
            font-weight: 600;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        input[type="text"], input[type="datetime-local"], textarea, select {
            width: 100%;
            padding: 8px 10px;
            margin-top: 3px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.9rem;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            height: 60px;
        }
        .color-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        input[type="color"] {
            border: none;
            width: 40px;
            height: 34px;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }
        .field-box {
            background: white;
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            margin-top: 8px;
            cursor: grab;
        }
        .field-box:active {
            cursor: grabbing;
        }
        .field-box.dragging {
            opacity: 0.4;
            border: 2px dashed var(--accent);
        }
        .btn-action {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-top: 10px;
        }
        .btn-action:hover {
            background: var(--accent-hover);
        }
        .btn-danger {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
        .btn-secondary {
            background: #475569;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
        }
        .btn-secondary:hover {
            background: #334155;
        }

        /* Discord Preview Layout */
        .preview-sticky {
            position: sticky;
            top: 20px;
        }
        .discord-chat {
            background-color: var(--discord-chat);
            border-radius: 8px;
            padding: 15px;
            color: #dbdee1;
            font-family: 'GG Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 0.9rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        .discord-embed-wrapper {
            display: flex;
            margin-top: 5px;
        }
        .discord-color-pill {
            width: 4px;
            background-color: #5865F2;
            border-radius: 4px;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .discord-embed-content {
            background-color: var(--discord-content);
            border-radius: 0 4px 4px 0;
            padding: 12px;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .discord-author {
            display: flex;
            align-items: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
            order: 1;
        }
        .discord-author img {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 8px;
            object-fit: cover;
            display: none;
        }
        .discord-body-section {
            order: 2;
        }
        .discord-title {
            font-weight: bold;
            color: #ffffff;
            font-size: 1rem;
            margin-bottom: 6px;
            display: block;
            text-decoration: none;
        }
        .discord-title:hover {
            text-decoration: underline;
        }
        .discord-description {
            color: #dbdee1;
            font-size: 0.875rem;
            white-space: pre-wrap;
            margin-bottom: 8px;
        }
        .discord-fields-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
            order: 3;
        }
        .discord-field {
            flex: 1;
            min-width: 100%;
            box-sizing: border-box;
        }
        .discord-field.inline {
            min-width: 30%;
            flex-basis: 30%;
        }
        .discord-field-name {
            font-size: 0.8rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 2px;
        }
        .discord-field-value {
            font-size: 0.85rem;
            color: #dbdee1;
            white-space: pre-wrap;
        }
        .discord-thumb-row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .discord-thumbnail {
            max-width: 80px;
            max-height: 80px;
            border-radius: 4px;
            object-fit: cover;
            display: none;
            margin-left: 10px;
            flex-shrink: 0;
        }
        .discord-main-image {
            max-width: 100%;
            border-radius: 4px;
            margin-top: 8px;
            display: none;
            order: 4;
        }
        .discord-footer {
            font-size: 0.75rem;
            color: #949ba4;
            display: flex;
            align-items: center;
            margin-top: 8px;
            order: 5;
        }
        .discord-footer img {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            margin-right: 6px;
            object-fit: cover;
            display: none;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Quick Templates & Version Bar -->
        <div class="top-bar">
            <div class="templates-group">
                <span class="version-badge">v2.5.0-ROBLOX</span>
                <span style="font-size: 0.85rem; font-weight: bold; color: var(--text-muted); margin-left: 5px;">Presets:</span>
                <div id="templateButtonsContainer" style="display:inline-flex; gap:8px;"></div>
                <button class="btn-preset" onclick="loadPreset('clear')">🧹 Clear</button>
            </div>
            <div class="actions-group">
                <button class="btn-secondary" onclick="exportJSON()">📋 Copy JSON</button>
                <button class="btn-secondary" style="background-color: #e11d48;" onclick="exportRobloxScript()">🎮 Copy Roblox Script</button>
            </div>
        </div>

        <div class="main-grid">
            <!-- Form Configurator -->
            <div class="card">
                <h2>Builder Controls ⚡</h2>
                <p style="font-size: 0.78rem; color: var(--text-muted); margin-top: -10px; margin-bottom: 15px;">Tip: Drag any section header card below to reorder your workspace layout!</p>
                
                <div id="builderSectionsContainer">
                    <!-- General Settings Section -->
                    <div class="draggable-section" draggable="true" data-section="general">
                        <div class="section-header">⠿ General Settings</div>
                        <label for="webhookURL">Webhook URL:</label>
                        <input type="text" id="webhookURL" placeholder="https://discord.com/api/webhooks/...">

                        <label for="embedTitle">Title:</label>
                        <input type="text" id="embedTitle" placeholder="Embed title..." oninput="updatePreview()">

                        <label for="embedURL">Title Hyperlink URL:</label>
                        <input type="text" id="embedURL" placeholder="https://example.com" oninput="updatePreview()">

                        <label for="embedDescription">Description (Supports Markdown & Timestamps):</label>
                        <textarea id="embedDescription" placeholder="Main description... e.g. Event starts <t:1672531199:R>" oninput="updatePreview()"></textarea>

                        <label>Sidebar Color:</label>
                        <div class="color-row">
                            <input type="color" id="embedColorPicker" value="#5865F2" oninput="syncColor('picker')">
                            <input type="text" id="embedColorHex" value="#5865F2" oninput="syncColor('hex')">
                        </div>
                    </div>

                    <!-- Author Section -->
                    <div class="draggable-section" draggable="true" data-section="author">
                        <div class="section-header">⠿ Author Information</div>
                        <label for="authorName">Author Name:</label>
                        <input type="text" id="authorName" placeholder="Author name..." oninput="updatePreview()">

                        <label for="authorIcon">Author Icon URL:</label>
                        <input type="text" id="authorIcon" placeholder="https://.../icon.png" oninput="updatePreview()">
                    </div>

                    <!-- Images Section -->
                    <div class="draggable-section" draggable="true" data-section="images">
                        <div class="section-header">⠿ Images & Thumbnails</div>
                        <label for="thumbnailURL">Thumbnail URL (Top-Right):</label>
                        <input type="text" id="thumbnailURL" placeholder="https://.../thumb.png" oninput="updatePreview()">

                        <label for="imageURL">Main Image URL (Bottom Banner):</label>
                        <input type="text" id="imageURL" placeholder="https://.../banner.png" oninput="updatePreview()">
                    </div>

                    <!-- Dynamic Fields Section -->
                    <div class="draggable-section" draggable="true" data-section="fields">
                        <div class="section-header">⠿ Dynamic Fields (<span id="fieldCount">0</span>/25)</div>
                        <button class="btn-secondary" onclick="addField()" style="width: 100%; margin-bottom: 10px;">+ Add Field</button>
                        <div id="fieldsContainer"></div>
                    </div>

                    <!-- Footer Section -->
                    <div class="draggable-section" draggable="true" data-section="footer">
                        <div class="section-header">⠿ Footer, Timestamp & Tags</div>
                        <label for="footerText">Footer Text:</label>
                        <input type="text" id="footerText" placeholder="Footer text..." oninput="updatePreview()">

                        <label for="footerIcon">Footer Icon URL:</label>
                        <input type="text" id="footerIcon" placeholder="https://.../footer-icon.png" oninput="updatePreview()">

                        <!-- Discord Timestamp Code Generator Helper -->
                        <div style="background: #f1f5f9; padding: 10px; border-radius: 6px; margin-top: 10px; border: 1px solid var(--border);">
                            <label style="margin-top: 0; color: var(--accent);">⏰ Discord Timestamp Generator</label>
                            <div style="display: flex; gap: 8px; margin-top: 5px;">
                                <input type="datetime-local" id="tsPicker" style="margin-top:0;">
                                <select id="tsStyle" style="margin-top:0; width: 130px;">
                                    <option value="R">Relative (e.g. 2h ago)</option>
                                    <option value="f">Short Date/Time</option>
                                    <option value="F">Long Date/Time</option>
                                    <option value="t">Short Time</option>
                                    <option value="T">Long Time</option>
                                    <option value="d">Short Date</option>
                                    <option value="D">Long Date</option>
                                </select>
                            </div>
                            <button class="btn-secondary" onclick="copyTimestampTag()" style="width: 100%; margin-top: 8px; font-size: 0.78rem;">📋 Copy Timestamp Tag (e.g. &lt;t:12345:R&gt;)</button>
                        </div>
                    </div>
                </div>

                <button class="btn-action" onclick="sendToDiscord()">🚀 Send Embed to Discord</button>
            </div>

            <!-- Live Preview Panel -->
            <div class="preview-sticky">
                <div class="card">
                    <h2>Live Preview 👀</h2>
                    <div class="discord-chat">
                        <div style="font-size: 0.8rem; color: #949ba4; margin-bottom: 4px;">Embed Bot <span style="background: #5865F2; color: white; font-size: 0.65rem; padding: 1px 4px; border-radius: 3px;">BOT</span></div>
                        <div class="discord-embed-wrapper">
                            <div class="discord-color-pill" id="prevColorPill"></div>
                            <div class="discord-embed-content">
                                <!-- Author -->
                                <div class="discord-author" id="prevAuthorContainer">
                                    <img id="prevAuthorIcon" src="" alt="">
                                    <span id="prevAuthorText"></span>
                                </div>

                                <!-- Title and Description Body Wrapper -->
                                <div class="discord-body-section">
                                    <div class="discord-thumb-row">
                                        <div style="flex: 1; overflow: hidden;">
                                            <!-- Title -->
                                            <a href="#" id="prevTitle" class="discord-title" style="display: none;" target="_blank"></a>
                                            <!-- Description -->
                                            <div id="prevDescription" class="discord-description" style="display: none;"></div>
                                        </div>
                                        <!-- Thumbnail -->
                                        <img id="prevThumbnail" class="discord-thumbnail" src="" alt="">
                                    </div>
                                </div>

                                <!-- Dynamic Fields -->
                                <div class="discord-fields-grid" id="prevFieldsGrid"></div>

                                <!-- Main Banner Image -->
                                <img id="prevImage" class="discord-main-image" src="" alt="">

                                <!-- Footer -->
                                <div class="discord-footer" id="prevFooterContainer" style="display: none;">
                                    <img id="prevFooterIcon" src="" alt="">
                                    <span id="prevFooterText"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let fields = [];
        let draggedIndex = null;
        let draggedSection = null;

        // ==========================================
        // 🚀 EASY TEMPLATES REGISTRY
        // ==========================================
        const templates = {
            welcome: {
                label: "👋 Welcome",
                title: "Welcome to the Server! 🎉",
                description: "We are thrilled to have you here! Check out the rules channel.",
                color: "#10b981",
                thumbnail: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=150",
                fields: [
                    { name: "📜 Rules", value: "Verified successfully", inline: true }
                ]
            },
            alert: {
                label: "🚨 Warning",
                title: "🚨 Maintenance Alert",
                description: "Scheduled system updates will take place shortly.",
                color: "#ef4444",
                fields: [
                    { name: "Status", value: "Pending", inline: true }
                ]
            },
            update: {
                label: "🚀 Update",
                title: "🚀 Version 2.5 Released!",
                description: "Added Roblox Luau script generation tool for HttpService!",
                color: "#6366f1",
                fields: [
                    { name: "✨ Features", value: "- Roblox Luau Code Export\n- One-click copy script", inline: false }
                ]
            }
        };

        // Automatically render template buttons on startup
        function initTemplates() {
            const container = document.getElementById('templateButtonsContainer');
            container.innerHTML = '';
            for (const key in templates) {
                const t = templates[key];
                const btn = document.createElement('button');
                btn.className = 'btn-preset';
                btn.innerText = t.label;
                btn.onclick = () => loadPreset(key);
                container.appendChild(btn);
            }
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('tsPicker').value = now.toISOString().slice(0, 16);
        }

        function parseDiscordTags(text) {
            if (!text) return '';
            return text.replace(/<t:(\d+)(?::([dDfFtTR]))?>/g, (match, unixStr, style) => {
                const date = new Date(parseInt(unixStr) * 1000);
                if (isNaN(date)) return match;
                
                if (style === 'R') {
                    const diffSeconds = Math.floor((new Date() - date) / 1000);
                    if (Math.abs(diffSeconds) < 60) return 'just now';
                    if (Math.abs(diffSeconds) < 3600) return `${Math.floor(Math.abs(diffSeconds)/60)} minutes ago`;
                    return `${Math.floor(Math.abs(diffSeconds)/3600)} hours ago`;
                }
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            });
        }

        function copyTimestampTag() {
            const val = document.getElementById('tsPicker').value;
            const style = document.getElementById('tsStyle').value;
            if (!val) {
                alert('Please pick a date and time first!');
                return;
            }
            const unixTime = Math.floor(new Date(val).getTime() / 1000);
            const tag = `<t:${unixTime}:${style}>`;
            navigator.clipboard.writeText(tag);
            alert(`Copied tag "${tag}" to clipboard! Paste it into any title, description, or field.`);
        }

        // Setup Global Section Drag & Drop Reordering
        const sectionsContainer = document.getElementById('builderSectionsContainer');
        const sectionElements = sectionsContainer.querySelectorAll('.draggable-section');

        sectionElements.forEach(section => {
            section.addEventListener('dragstart', (e) => {
                draggedSection = section;
                setTimeout(() => section.classList.add('dragging'), 0);
            });

            section.addEventListener('dragend', (e) => {
                section.classList.remove('dragging');
                draggedSection = null;
            });

            section.addEventListener('dragover', (e) => {
                e.preventDefault();
            });

            section.addEventListener('drop', (e) => {
                e.preventDefault();
                if (draggedSection && draggedSection !== section) {
                    const allSections = [...sectionsContainer.querySelectorAll('.draggable-section')];
                    const draggedPos = allSections.indexOf(draggedSection);
                    const targetPos = allSections.indexOf(section);

                    if (draggedPos < targetPos) {
                        sectionsContainer.insertBefore(draggedSection, section.nextSibling);
                    } else {
                        sectionsContainer.insertBefore(draggedSection, section);
                    }
                }
            });
        });

        function syncColor(source) {
            const picker = document.getElementById('embedColorPicker');
            const hex = document.getElementById('embedColorHex');
            if (source === 'picker') {
                hex.value = picker.value;
            } else {
                if (/^#[0-9A-F]{6}$/i.test(hex.value)) {
                    picker.value = hex.value;
                }
            }
            updatePreview();
        }

        function addField(name = '', value = '', inline = false) {
            if (fields.length >= 25) {
                alert('Discord allows a maximum of 25 fields per embed.');
                return;
            }
            fields.push({ name, value, inline });
            renderFieldsForm();
            updatePreview();
        }

        function removeField(index) {
            fields.splice(index, 1);
            renderFieldsForm();
            updatePreview();
        }

        function renderFieldsForm() {
            const container = document.getElementById('fieldsContainer');
            document.getElementById('fieldCount').innerText = fields.length;
            container.innerHTML = '';

            fields.forEach((field, index) => {
                const box = document.createElement('div');
                box.className = 'field-box';
                box.draggable = true;
                box.dataset.index = index;

                box.addEventListener('dragstart', (e) => {
                    e.stopPropagation();
                    draggedIndex = index;
                    setTimeout(() => box.classList.add('dragging'), 0);
                });

                box.addEventListener('dragend', (e) => {
                    box.classList.remove('dragging');
                    draggedIndex = null;
                });

                box.addEventListener('dragover', (e) => {
                    e.preventDefault();
                });

                box.addEventListener('drop', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    if (draggedIndex !== null && draggedIndex !== index) {
                        const movedField = fields.splice(draggedIndex, 1)[0];
                        fields.splice(index, 0, movedField);
                        renderFieldsForm();
                        updatePreview();
                    }
                });

                box.innerHTML = `
                    <div style="font-size: 0.75rem; font-weight: bold; color: var(--accent); margin-bottom: 4px;">⠿ Field #${index + 1}</div>
                    <label>Name:</label>
                    <input type="text" value="${field.name}" oninput="fields[${index}].name = this.value; updatePreview()">
                    <label>Value:</label>
                    <textarea oninput="fields[${index}].value = this.value; updatePreview()">${field.value}</textarea>
                    <label style="display: flex; align-items: center; gap: 6px; margin-top: 6px; cursor: pointer;">
                        <input type="checkbox" ${field.inline ? 'checked' : ''} onchange="fields[${index}].inline = this.checked; updatePreview()"> Inline Field
                    </label>
                    <button class="btn-danger" onclick="removeField(${index})">Delete Field</button>
                `;
                container.appendChild(box);
            });
        }

        function updatePreview() {
            const title = document.getElementById('embedTitle').value;
            const url = document.getElementById('embedURL').value;
            const description = document.getElementById('embedDescription').value;
            const hexColor = document.getElementById('embedColorHex').value;
            
            const authorName = document.getElementById('authorName').value;
            const authorIcon = document.getElementById('authorIcon').value;
            
            const thumbnailURL = document.getElementById('thumbnailURL').value;
            const imageURL = document.getElementById('imageURL').value;
            
            const footerText = document.getElementById('footerText').value;
            const footerIcon = document.getElementById('footerIcon').value;

            document.getElementById('prevColorPill').style.backgroundColor = hexColor || '#5865F2';

            const prevTitle = document.getElementById('prevTitle');
            if (title) {
                prevTitle.innerText = parseDiscordTags(title);
                prevTitle.style.display = 'block';
                prevTitle.href = url ? url : '#';
            } else {
                prevTitle.style.display = 'none';
            }

            const prevDesc = document.getElementById('prevDescription');
            if (description) {
                prevDesc.innerText = parseDiscordTags(description);
                prevDesc.style.display = 'block';
            } else {
                prevDesc.style.display = 'none';
            }

            const prevAuthorContainer = document.getElementById('prevAuthorContainer');
            const prevAuthorText = document.getElementById('prevAuthorText');
            const prevAuthorIcon = document.getElementById('prevAuthorIcon');
            if (authorName) {
                prevAuthorText.innerText = parseDiscordTags(authorName);
                prevAuthorContainer.style.display = 'flex';
                if (authorIcon) {
                    prevAuthorIcon.src = authorIcon;
                    prevAuthorIcon.style.display = 'block';
                } else {
                    prevAuthorIcon.style.display = 'none';
                }
            } else {
                prevAuthorContainer.style.display = 'none';
            }

            const prevThumb = document.getElementById('prevThumbnail');
            if (thumbnailURL) {
                prevThumb.src = thumbnailURL;
                prevThumb.style.display = 'block';
            } else {
                prevThumb.style.display = 'none';
            }

            const prevFieldsGrid = document.getElementById('prevFieldsGrid');
            prevFieldsGrid.innerHTML = '';
            fields.forEach(f => {
                if (f.name || f.value) {
                    const fDiv = document.createElement('div');
                    fDiv.className = `discord-field ${f.inline ? 'inline' : ''}`;
                    fDiv.innerHTML = `
                        <div class="discord-field-name">${parseDiscordTags(f.name)}</div>
                        <div class="discord-field-value">${parseDiscordTags(f.value)}</div>
                    `;
                    prevFieldsGrid.appendChild(fDiv);
                }
            });

            const prevImage = document.getElementById('prevImage');
            if (imageURL) {
                prevImage.src = imageURL;
                prevImage.style.display = 'block';
            } else {
                prevImage.style.display = 'none';
            }

            const prevFooterContainer = document.getElementById('prevFooterContainer');
            const prevFooterText = document.getElementById('prevFooterText');
            const prevFooterIcon = document.getElementById('prevFooterIcon');
            if (footerText) {
                prevFooterText.innerText = parseDiscordTags(footerText);
                prevFooterContainer.style.display = 'flex';
                if (footerIcon) {
                    prevFooterIcon.src = footerIcon;
                    prevFooterIcon.style.display = 'block';
                } else {
                    prevFooterIcon.style.display = 'none';
                }
            } else {
                prevFooterContainer.style.display = 'none';
            }
        }

        function buildPayloadObject() {
            const hexColor = document.getElementById('embedColorHex').value;
            const decimalColor = parseInt(hexColor.replace('#', ''), 16) || 5793266;

            const embed = { color: decimalColor };

            const title = document.getElementById('embedTitle').value;
            const url = document.getElementById('embedURL').value;
            const description = document.getElementById('embedDescription').value;
            const authorName = document.getElementById('authorName').value;
            const authorIcon = document.getElementById('authorIcon').value;
            const thumbnailURL = document.getElementById('thumbnailURL').value;
            const imageURL = document.getElementById('imageURL').value;
            const footerText = document.getElementById('footerText').value;
            const footerIcon = document.getElementById('footerIcon').value;

            if (title) embed.title = title;
            if (url) embed.url = url;
            if (description) embed.description = description;

            if (authorName) {
                embed.author = { name: authorName };
                if (authorIcon) embed.author.icon_url = authorIcon;
            }

            if (thumbnailURL) embed.thumbnail = { url: thumbnailURL };
            if (imageURL) embed.image = { url: imageURL };

            if (fields.length > 0) {
                embed.fields = fields.map(f => ({ name: f.name || '\u200b', value: f.value || '\u200b', inline: f.inline }));
            }

            if (footerText) {
                embed.footer = { text: footerText };
                if (footerIcon) embed.footer.icon_url = footerIcon;
            }

            embed.timestamp = new Date().toISOString();
            return { embeds: [embed] };
        }

        function exportJSON() {
            const payload = buildPayloadObject();
            navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
            alert('Embed JSON copied to your clipboard!');
        }

        // Helper to convert JS object recursively to Roblox Luau table format
        function jsObjectToLua(obj, indent = 1) {
            const spaces = "    ".repeat(indent);
            if (Array.isArray(obj)) {
                if (obj.length === 0) return "{}";
                let items = obj.map(item => `${spaces}${jsObjectToLua(item, indent + 1)}`).join(",\n");
                return `{\n${items}\n${"    ".repeat(indent - 1)}}`;
            } else if (typeof obj === 'object' && obj !== null) {
                const keys = Object.keys(obj);
                if (keys.length === 0) return "{}";
                let entries = keys.map(k => {
                    const val = jsObjectToLua(obj[k], indent + 1);
                    const keyStr = /^[a-zA-Z_][a-zA-Z0-9_]*$/.test(k) ? k : `["${k}"]`;
                    return `${spaces}${keyStr} = ${val}`;
                }).join(",\n");
                return `{\n${entries}\n${"    ".repeat(indent - 1)}}`;
            } else if (typeof obj === 'string') {
                return `"${obj.replace(/"/g, '\\"')}"`;
            } else {
                return String(obj);
            }
        }

        function exportRobloxScript() {
            const payload = buildPayloadObject();
            const webhookURL = document.getElementById('webhookURL').value.trim() || "YOUR_WEBHOOK_URL_HERE";
            
            const luauCode = `-- Script to send Discord Webhook from Roblox Studio\n` +
                `local HttpService = game:GetService("HttpService")\n\n` +
                `local webhookUrl = "${webhookURL}"\n` +
                `local data = ${jsObjectToLua(payload)}\n\n` +
                `local success, errorMessage = pcall(function()\n` +
                `    HttpService:PostAsync(webhookUrl, HttpService:JSONEncode(data), Enum.HttpContentType.ApplicationJson)\n` +
                `end)\n\n` +
                `if not success then\n` +
                `    warn("Failed to send Discord webhook: " .. tostring(errorMessage))\n` +
                `else\n` +
                `    print("Discord webhook sent successfully!")\n` +
                `end`;

            navigator.clipboard.writeText(luauCode);
            alert('Roblox Luau script copied to your clipboard! Paste it into a Script in Roblox Studio.');
        }

        function loadPreset(type) {
            if (type === 'clear') {
                document.getElementById('embedTitle').value = '';
                document.getElementById('embedURL').value = '';
                document.getElementById('embedDescription').value = '';
                document.getElementById('authorName').value = '';
                document.getElementById('authorIcon').value = '';
                document.getElementById('thumbnailURL').value = '';
                document.getElementById('imageURL').value = '';
                document.getElementById('footerText').value = '';
                document.getElementById('footerIcon').value = '';
                fields = [];
            } else if (templates[type]) {
                const t = templates[type];
                document.getElementById('embedTitle').value = t.title || '';
                document.getElementById('embedDescription').value = t.description || '';
                document.getElementById('embedColorHex').value = t.color || '#5865F2';
                document.getElementById('thumbnailURL').value = t.thumbnail || '';
                document.getElementById('imageURL').value = t.image || '';
                document.getElementById('authorName').value = t.authorName || '';
                document.getElementById('authorIcon').value = t.authorIcon || '';
                document.getElementById('footerText').value = t.footerText || '';
                document.getElementById('footerIcon').value = t.footerIcon || '';
                fields = t.fields ? JSON.parse(JSON.stringify(t.fields)) : [];
            }
            syncColor('hex');
            renderFieldsForm();
            updatePreview();
        }

        function sendToDiscord() {
            const webhookURL = document.getElementById('webhookURL').value.trim();
            if (!webhookURL) {
                alert('Please enter your Discord Webhook URL at the top!');
                return;
            }

            const payload = buildPayloadObject();

            fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    alert('Embed successfully sent to Discord!');
                } else {
                    alert('Failed to send. Double-check your Webhook URL or image links.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred while sending.');
            });
        }

        initTemplates();
        updatePreview();
    </script>
