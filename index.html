<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Discord Embed Builder</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #a29bfe);
            color: #333;
            padding: 40px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            font-size: 1.6rem;
            margin-top: 0;
            color: #2d3436;
            text-align: center;
        }
        fieldset {
            border: 1px solid #dfe6e9;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }
        legend {
            font-weight: bold;
            color: #0984e3;
            padding: 0 5px;
        }
        label {
            display: block;
            margin-top: 10px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #636e72;
        }
        input[type="text"], textarea, input[type="color"] {
            width: 100%;
            padding: 8px 10px;
            margin-top: 4px;
            border: 1px solid #dfe6e9;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        textarea {
            resize: vertical;
            height: 60px;
        }
        button {
            background-color: #0984e3;
            color: white;
            border: none;
            padding: 14px 20px;
            margin-top: 25px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #74b9ff;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Ultimate Embed Customizer ⚡</h1>
        
        <!-- General Settings -->
        <fieldset>
            <legend>Main Content</legend>
            <label for="embedTitle">Title:</label>
            <input type="text" id="embedTitle" placeholder="Embed title...">

            <label for="embedURL">Title URL (Clickable Title):</label>
            <input type="text" id="embedURL" placeholder="https://example.com">

            <label for="embedDescription">Description:</label>
            <textarea id="embedDescription" placeholder="Main description text..."></textarea>

            <label for="embedColor">Sidebar Color:</label>
            <input type="color" id="embedColor" value="#5865F2">
        </fieldset>

        <!-- Author Section -->
        <fieldset>
            <legend>Author Info</legend>
            <label for="authorName">Author Name:</label>
            <input type="text" id="authorName" placeholder="Author text...">

            <label for="authorIcon">Author Icon URL:</label>
            <input type="text" id="authorIcon" placeholder="https://image-url.com/icon.png">
        </fieldset>

        <!-- Images Section -->
        <fieldset>
            <legend>Images</legend>
            <label for="thumbnailURL">Thumbnail URL (Top Right):</label>
            <input type="text" id="thumbnailURL" placeholder="https://image-url.com/thumb.png">

            <label for="imageURL">Main Image URL (Big bottom image):</label>
            <input type="text" id="imageURL" placeholder="https://image-url.com/main.png">
        </fieldset>

        <!-- Footer Section -->
        <fieldset>
            <legend>Footer & Timestamp</legend>
            <label for="footerText">Footer Text:</label>
            <input type="text" id="footerText" placeholder="Small text at the very bottom...">

            <label for="footerIcon">Footer Icon URL:</label>
            <input type="text" id="footerIcon" placeholder="https://image-url.com/footer-icon.png">
        </fieldset>

        <button onclick="sendFullEmbedToDiscord()">Send Custom Embed to Discord</button>
    </div>

    <script>
        function sendFullEmbedToDiscord() {
            const webhookURL = 'YOUR_DISCORD_WEBHOOK_URL_HERE'; // Replace with your actual webhook URL

            // Gather all values from the inputs
            const title = document.getElementById('embedTitle').value;
            const url = document.getElementById('embedURL').value;
            const description = document.getElementById('embedDescription').value;
            const hexColor = document.getElementById('embedColor').value;
            const decimalColor = parseInt(hexColor.replace('#', ''), 16);

            const authorName = document.getElementById('authorName').value;
            const authorIcon = document.getElementById('authorIcon').value;

            const thumbnailURL = document.getElementById('thumbnailURL').value;
            const imageURL = document.getElementById('imageURL').value;

            const footerText = document.getElementById('footerText').value;
            const footerIcon = document.getElementById('footerIcon').value;

            // Build the dynamic embed object structure
            const embed = {
                color: decimalColor
            };

            if (title) embed.title = title;
            if (url) embed.url = url;
            if (description) embed.description = description;

            if (authorName) {
                embed.author = { name: authorName };
                if (authorIcon) embed.author.icon_url = authorIcon;
            }

            if (thumbnailURL) {
                embed.thumbnail = { url: thumbnailURL };
            }

            if (imageURL) {
                embed.image = { url: imageURL };
            }

            if (footerText) {
                embed.footer = { text: footerText };
                if (footerIcon) embed.footer.icon_url = footerIcon;
            }

            // Automatically add timestamp if footer or elements exist
            embed.timestamp = new Date().toISOString();

            const payload = {
                embeds: [embed]
            };

            fetch(webhookURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(response => {
                if (response.ok) {
                    alert('Full custom embed sent successfully!');
                } else {
                    alert('Failed to send. Check your webhook URL or image links.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('An error occurred.');
            });
        }
    </script>
</body>
</html>
